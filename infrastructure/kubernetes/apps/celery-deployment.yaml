apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitflow-worker
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: fitflow-worker

  template:
    metadata:
      labels:
        app: fitflow-worker

    spec:
      nodeSelector:
        kubernetes.io/hostname: fitflow-app

      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      containers:
        - name: worker
          image: aisharust94/fitflow-worker
          imagePullPolicy: IfNotPresent

          command:
            - celery
          args:
            - -A
            - tasks.notifications.celery_app
            - worker
            - --loglevel=info
            - --concurrency=2

          env:
            - name: REDIS_URL
              value: "redis://redis:6379/0"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"