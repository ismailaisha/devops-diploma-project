apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fitflow-redis-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitflow-redis
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 3

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: fitflow-redis

  template:
    metadata:
      labels:
        app: fitflow-redis

    spec:
      nodeSelector:
        kubernetes.io/hostname: fitflow-app

      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent

          args:
            - redis-server
            - --appendonly
            - "yes"

          ports:
            - name: redis
              containerPort: 6379

          volumeMounts:
            - name: data
              mountPath: /data

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          startupProbe:
            exec:
              command:
                - sh
                - -c
                - 'test "$(redis-cli ping)" = PONG'
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'test "$(redis-cli ping)" = PONG'
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'test "$(redis-cli ping)" = PONG'
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fitflow-redis-data