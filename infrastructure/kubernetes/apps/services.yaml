apiVersion: v1
kind: Service
metadata:
  name: fitflow-frontend-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: fitflow-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: default
spec:
  type: NodePort
  selector:
    app: fitflow-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30008
