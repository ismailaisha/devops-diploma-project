apiVersion: v1
kind: Service
metadata:
  name: fitflow-frontend-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: fitflow-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: fitflow-api
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: fitflow-redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379