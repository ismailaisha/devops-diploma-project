apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitflow-frontend
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: fitflow-frontend

  template:
    metadata:
      labels:
        app: fitflow-frontend

    spec:
      nodeSelector:
        kubernetes.io/hostname: fitflow-app

      automountServiceAccountToken: false

      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for API health endpoint..."
              until wget -q -T 5 -O /dev/null http://api:8000/health; do
                sleep 5
              done
              echo "API is ready."

          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"

      containers:
        - name: frontend
          image: aisharust94/fitflow-frontend
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3