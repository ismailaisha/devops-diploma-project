---
- name: Configure FitFlow application secrets in Kubernetes
  hosts: k3s_master
  become: true
  gather_facts: false

  vars_files:
    - ../inventory/group_vars/database/vault.yml

  vars:
    fitflow_database_host: "10.8.0.3"

  tasks:
    - name: Validate application secrets
      ansible.builtin.assert:
        that:
          - fitflow_db_password is defined
          - fitflow_secret_key is defined
          - fitflow_db_password | string | length > 0
          - fitflow_secret_key | string | length >= 32
        fail_msg: "Required application secrets are missing or invalid."
      no_log: true

    - name: Create or update FitFlow Secret
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - apply
          - --server-side
          - --field-manager=fitflow-ansible
          - -f
          - "-"
        stdin: >-
          {{
            {
              'apiVersion': 'v1',
              'kind': 'Secret',
              'metadata': {
                'name': 'fitflow-secrets',
                'namespace': 'default'
              },
              'type': 'Opaque',
              'data': {
                'DATABASE_URL': (
                  'postgresql://fitflow:' ~
                  (fitflow_db_password | string | urlencode | replace('/', '%2F')) ~
                  '@' ~ fitflow_database_host ~ ':5432/fitflow'
                ) | b64encode,
                'SECRET_KEY': (fitflow_secret_key | string) | b64encode
              }
            } | to_json
          }}
      no_log: true

    - name: Verify FitFlow Secret exists
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - -n
          - default
          - get
          - secret
          - fitflow-secrets
          - -o
          - name
      register: fitflow_secret_check
      changed_when: false

    - name: Report Secret readiness
      ansible.builtin.debug:
        msg: "{{ fitflow_secret_check.stdout }}"