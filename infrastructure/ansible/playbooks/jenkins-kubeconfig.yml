---
- name: Prepare Kubernetes credentials for Jenkins
  hosts: k3s_master
  become: true
  gather_facts: false

  vars:
    jenkins_kubeconfig_path: >-
      {{ lookup('env', 'HOME') }}/.kube/fitflow-jenkins.yaml

  tasks:
    - name: Create Jenkins service account token Secret
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - apply
          - -f
          - "-"
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: jenkins-deployer-token
            namespace: default
            annotations:
              kubernetes.io/service-account.name: jenkins-deployer
          type: kubernetes.io/service-account-token
      register: jenkins_token_created
      changed_when: >-
        'created' in jenkins_token_created.stdout or
        'configured' in jenkins_token_created.stdout

    - name: Wait for token and cluster certificate
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - -n
          - default
          - get
          - secret
          - jenkins-deployer-token
          - -o
          - json
      register: jenkins_token_secret
      changed_when: false
      until: >-
        ((jenkins_token_secret.stdout | from_json).get('data', {}).get('token', '') | length > 0)
        and
        ((jenkins_token_secret.stdout | from_json).get('data', {}).get('ca.crt', '') | length > 0)
      retries: 12
      delay: 5
      no_log: true

    - name: Create local kubeconfig directory
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.kube"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Save Jenkins kubeconfig on laptop
      ansible.builtin.copy:
        dest: "{{ jenkins_kubeconfig_path }}"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: fitflow
              cluster:
                server: https://10.8.0.5:6443
                certificate-authority-data: {{ (jenkins_token_secret.stdout | from_json)['data']['ca.crt'] }}
          users:
            - name: jenkins-deployer
              user:
                token: {{ (jenkins_token_secret.stdout | from_json)['data']['token'] | b64decode }}
          contexts:
            - name: fitflow
              context:
                cluster: fitflow
                user: jenkins-deployer
                namespace: default
          current-context: fitflow
      delegate_to: localhost
      become: false
      no_log: true