---
- name: Validate SSH before reload
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t
  changed_when: false
  listen: Reload SSH

- name: Reload SSH service
  ansible.builtin.systemd:
    name: ssh
    state: reloaded
  listen: Reload SSH

- name: Restart Node Exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: restarted
    daemon_reload: true