
---
# ============================================================
# FITFLOW — COMMON ROLE
# Базовая подготовка Ubuntu для всех 6 серверов
# ============================================================

# ------------------------------------------------------------
# 1. APT И БАЗОВЫЕ ПАКЕТЫ
# ------------------------------------------------------------

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags:
    - packages

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - net-tools
      - ufw
      - unzip
      - ca-certificates
      - gnupg
      - lsb-release
      - python3-pip
    state: present
  tags:
    - packages


# ------------------------------------------------------------
# 2. ПОЛЬЗОВАТЕЛЬ DEPLOYER
# ------------------------------------------------------------

- name: Create deployer user
  ansible.builtin.user:
    name: deployer
    shell: /bin/bash
    groups:
      - sudo
    append: true
    create_home: true
    state: present
  tags:
    - users

- name: Configure passwordless sudo for deployer
  ansible.builtin.copy:
    dest: /etc/sudoers.d/deployer
    content: "deployer ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  tags:
    - users

- name: Add SSH public key for deployer
  ansible.posix.authorized_key:
    user: deployer
    key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/fitflow-key.pem.pub') }}"
    state: present
  tags:
    - users


# ------------------------------------------------------------
# 3. СИСТЕМНЫЕ НАСТРОЙКИ
# ------------------------------------------------------------

- name: Set timezone to UTC
  community.general.timezone:
    name: UTC
  tags:
    - system


# ------------------------------------------------------------
# 4. NODE EXPORTER
# ------------------------------------------------------------

- name: Check Node Exporter archive on controller
  ansible.builtin.stat:
    path: "{{ node_exporter_archive }}"
  delegate_to: localhost
  become: false
  register: node_exporter_archive_file
  tags:
    - monitoring_agent

- name: Verify Node Exporter archive exists
  ansible.builtin.assert:
    that:
      - node_exporter_archive_file.stat.exists
      - node_exporter_archive_file.stat.size > 0
    fail_msg: >-
      Node Exporter archive is missing:
      {{ node_exporter_archive }}
  tags:
    - monitoring_agent

- name: Create Node Exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
    state: present
  tags:
    - monitoring_agent

- name: Copy Node Exporter archive
  ansible.builtin.copy:
    src: "{{ node_exporter_archive }}"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    owner: root
    group: root
    mode: "0644"
  tags:
    - monitoring_agent

- name: Extract Node Exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
  tags:
    - monitoring_agent

- name: Install Node Exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart Node Exporter
  tags:
    - monitoring_agent

- name: Create Node Exporter systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      Documentation=https://github.com/prometheus/node_exporter
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=simple
      User=node_exporter
      Group=node_exporter
      ExecStart=/usr/local/bin/node_exporter
      Restart=on-failure
      RestartSec=5s
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=strict
      ProtectHome=true

      [Install]
      WantedBy=multi-user.target
  notify: Restart Node Exporter
  tags:
    - monitoring_agent

- name: Enable and start Node Exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
  tags:
    - monitoring_agent

- name: Remove Node Exporter temporary archive
  ansible.builtin.file:
    path: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    state: absent
  tags:
    - monitoring_agent

- name: Remove Node Exporter temporary directory
  ansible.builtin.file:
    path: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"
    state: absent
  tags:
    - monitoring_agent
