---
# Docker
- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags: docker

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  tags: docker

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
    state: present
    update_cache: true
  tags: docker

- name: Install Docker components
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
  tags: docker

- name: Start and enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  tags: docker

# Каталоги
- name: Create monitoring directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/monitoring
    - /opt/monitoring/prometheus
    - /opt/monitoring/grafana
    - /opt/monitoring/loki
  tags: monitoring

# Prometheus
- name: Copy Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /opt/monitoring/prometheus/prometheus.yml
    mode: "0644"
  notify: Restart monitoring
  tags: monitoring

# Loki
- name: Copy Loki config
  ansible.builtin.copy:
    dest: /opt/monitoring/loki/loki.yml
    owner: root
    group: root
    mode: "0644"
    backup: true
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100

      ingester:
        wal:
          enabled: true
          dir: /loki/wal
        lifecycler:
          address: 127.0.0.1
          ring:
            kvstore:
              store: inmemory
            replication_factor: 1

      schema_config:
        configs:
          - from: 2020-10-24
            store: boltdb-shipper
            object_store: filesystem
            schema: v11
            index:
              prefix: index_
              period: 24h

      storage_config:
        boltdb_shipper:
          active_index_directory: /loki/index
          cache_location: /loki/index_cache
        filesystem:
          directory: /loki/chunks

      compactor:
        working_directory: /loki/compactor

      limits_config:
        allow_structured_metadata: false
        reject_old_samples: true
        reject_old_samples_max_age: 168h
  notify: Restart Loki
  tags:
    - monitoring
    - loki_config

- name: Apply pending monitoring handlers
  ansible.builtin.meta: flush_handlers
  tags: loki_config

- name: Wait for Loki readiness
  ansible.builtin.uri:
    url: http://127.0.0.1:3100/ready
    status_code: 200
    use_proxy: false
    timeout: 5
  register: loki_readiness
  until: loki_readiness.status | default(0) == 200
  retries: 24
  delay: 5
  tags: loki_config

# Compose
- name: Copy monitoring docker-compose
  ansible.builtin.template:
    src: docker-compose.monitoring.yml.j2
    dest: /opt/monitoring/docker-compose.yml
    mode: "0644"
  notify: Restart monitoring
  tags: monitoring

- name: Start monitoring stack
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/monitoring
  changed_when: true
  tags: monitoring

# Firewall
- name: UFW - allow Grafana
  community.general.ufw:
    rule: allow
    port: "3000"
    proto: tcp
  tags: firewall

- name: UFW - allow Prometheus
  community.general.ufw:
    rule: allow
    port: "9090"
    proto: tcp
  tags: firewall

- name: UFW - allow Loki
  community.general.ufw:
    rule: allow
    port: "3100"
    proto: tcp
  tags: firewall