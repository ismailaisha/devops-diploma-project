---
# ============================================================
# WireGuard: установка и подготовка каталога
# ============================================================

- name: "WireGuard: Установка пакетов"
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - wireguard

- name: "WireGuard: Создание защищённого каталога"
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags:
    - wireguard
    - wireguard_keys

# ============================================================
# Этап 1. Ключи
# ============================================================

- name: "WireGuard: Проверка существования private key"
  ansible.builtin.stat:
    path: /etc/wireguard/private.key
  register: wg_private_key_file
  tags:
    - wireguard
    - wireguard_keys

- name: "WireGuard: Генерация private key"
  ansible.builtin.command:
    cmd: wg genkey
  register: wg_private_key_generated
  when: not wg_private_key_file.stat.exists
  changed_when: true
  no_log: true
  tags:
    - wireguard
    - wireguard_keys

- name: "WireGuard: Сохранение private key"
  ansible.builtin.copy:
    content: "{{ wg_private_key_generated.stdout | trim }}\n"
    dest: /etc/wireguard/private.key
    owner: root
    group: root
    mode: "0600"
  when: not wg_private_key_file.stat.exists
  no_log: true
  tags:
    - wireguard
    - wireguard_keys

- name: "WireGuard: Настройка прав private key"
  ansible.builtin.file:
    path: /etc/wireguard/private.key
    owner: root
    group: root
    mode: "0600"
  tags:
    - wireguard
    - wireguard_keys

- name: "WireGuard: Чтение private key"
  ansible.builtin.slurp:
    src: /etc/wireguard/private.key
  register: wg_private_key_slurped
  no_log: true
  tags:
    - wireguard
    - wireguard_keys

- name: "WireGuard: Получение public key"
  ansible.builtin.command:
    cmd: wg pubkey
    stdin: "{{ wg_private_key_slurped.content | b64decode | trim }}"
  register: wg_public_key_generated
  changed_when: false
  no_log: true
  tags:
    - wireguard
    - wireguard_keys

- name: "WireGuard: Сохранение public key"
  ansible.builtin.copy:
    content: "{{ wg_public_key_generated.stdout | trim }}\n"
    dest: /etc/wireguard/public.key
    owner: root
    group: root
    mode: "0644"
  tags:
    - wireguard
    - wireguard_keys

- name: "WireGuard: Сохранение ключей в host facts"
  ansible.builtin.set_fact:
    wg_private_key: "{{ wg_private_key_slurped.content | b64decode | trim }}"
    wg_public_key: "{{ wg_public_key_generated.stdout | trim }}"
  no_log: true
  tags:
    - wireguard
    - wireguard_keys

# ============================================================
# Этап 2. Конфигурация
# При strategy=linear ключи подготавливаются на всех хостах
# текущего play до перехода к созданию конфигурации.
# ============================================================

- name: "WireGuard: Создание конфигурации wg0"
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify:
    - Restart WireGuard
  tags:
    - wireguard
    - wireguard_config

- name: "WireGuard: Разрешение UDP 51820 в UFW"
  community.general.ufw:
    rule: allow
    port: "51820"
    proto: udp
  tags:
    - wireguard
    - firewall

- name: "WireGuard: Включение и запуск wg-quick@wg0"
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
  tags:
    - wireguard

- name: "WireGuard: Применение ожидающих обработчиков"
  ansible.builtin.meta: flush_handlers
  tags:
    - wireguard

- name: "WireGuard: Получение текущего состояния"
  ansible.builtin.command:
    cmd: wg show
  register: wg_status
  changed_when: false
  tags:
    - wireguard
    - wireguard_check

- name: "WireGuard: Вывод состояния"
  ansible.builtin.debug:
    msg: "{{ wg_status.stdout }}"
  tags:
    - wireguard
    - wireguard_check