---
# ============================================================
# WireGuard
# Этап 1: подготовка ключей
# Этап 2: создание конфигурации
# ============================================================

- name: "WireGuard: Установка пакетов"
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
    update_cache: true
  tags:
    - wireguard

# ------------------------------------------------------------
# ЭТАП 1. Ключи
# ------------------------------------------------------------

- name: "WireGuard: Проверка существования private key"
  ansible.builtin.stat:
    path: /etc/wireguard/private.key
  register: wg_private_key_file
  tags:
    - wireguard
    - wireguard_keys

- name: "WireGuard: Генерация private key"
  ansible.builtin.shell:
    cmd: wg genkey
  register: wg_private_key_generated
  when: not wg_private_key_file.stat.exists
  changed_when: true
  no_log: true
  tags:
    - wireguard
    - wireguard_keys

- name: "WireGuard: Сохранение private key"
  ansible.builtin.copy:
    content: "{{ wg_private_key_generated.stdout | trim }}\n"
    dest: /etc/wireguard/private.key
    owner: root
    group: root
    mode: "0600"
  when: not wg_private_key_file.stat.exists
  no_log: true
  tags:
    - wireguard
    - wireguard_keys

- name: "WireGuard: Чтение private key"
  ansible.builtin.slurp:
    src: /etc/wireguard/private.key
  register: wg_private_key_slurped
  no_log: true
  tags:
    - wireguard
    - wireguard_keys

- name: "WireGuard: Генерация public key"
  ansible.builtin.shell:
    cmd: "printf '%s' '{{ wg_private_key_slurped.content | b64decode | trim }}' | wg pubkey"
  register: wg_public_key_generated
  changed_when: false
  no_log: true
  tags:
    - wireguard
    - wireguard_keys

- name: "WireGuard: Сохранение public key"
  ansible.builtin.copy:
    content: "{{ wg_public_key_generated.stdout | trim }}\n"
    dest: /etc/wireguard/public.key
    owner: root
    group: root
    mode: "0644"
  tags:
    - wireguard
    - wireguard_keys

- name: "WireGuard: Сохранение ключей в host facts"
  ansible.builtin.set_fact:
    wg_private_key: "{{ wg_private_key_slurped.content | b64decode | trim }}"
    wg_public_key: "{{ wg_public_key_generated.stdout | trim }}"
  no_log: true
  tags:
    - wireguard
    - wireguard_keys

# ------------------------------------------------------------
# ЭТАП 2. Конфигурация
#
# Этот task выполняется после всех предыдущих tasks на всех
# хостах при стандартной strategy=linear.
# Поэтому hostvars содержит public key каждого сервера.
# ------------------------------------------------------------

- name: "WireGuard: Создание конфигурации wg0"
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: "0600"

  notify:
    - Restart WireGuard
  tags:
    - wireguard
    - wireguard_config

- name: "WireGuard: Разрешение UDP 51820 в UFW"
  ansible.builtin.ufw:
    rule: allow
    port: "51820"
    proto: udp
  tags:
    - wireguard
    - firewall

- name: "WireGuard: Включение и запуск wg-quick@wg0"
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
  tags:
    - wireguard

- name: "WireGuard: Получение текущего состояния"
  ansible.builtin.command:
    cmd: wg show
  register: wg_status
  changed_when: false
  tags:
    - wireguard
    - wireguard_check

- name: "WireGuard: Вывод состояния"
  ansible.builtin.debug:
    msg: "{{ wg_status.stdout }}"
  tags:
    - wireguard
    - wireguard_check