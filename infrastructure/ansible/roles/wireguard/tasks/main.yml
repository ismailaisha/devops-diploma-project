---
# ─────────────────────────────────────────
# Роль wireguard — VPN туннель
# Связывает все серверы в одну сеть
# ─────────────────────────────────────────

# ─── Установка WireGuard ─────────────────

- name: Install WireGuard
  apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
    update_cache: true
  tags: wireguard

# ─── Генерация ключей ────────────────────
# Генерируем приватный ключ
- name: Generate WireGuard private key
  shell: wg genkey
  register: wg_private_key
  changed_when: false
  tags: wireguard

# Получаем публичный ключ из приватного
- name: Generate WireGuard public key
  shell: echo "{{ wg_private_key.stdout }}" | wg pubkey
  register: wg_public_key
  changed_when: false
  tags: wireguard

# Сохраняем приватный ключ в файл
- name: Save private key
  copy:
    content: "{{ wg_private_key.stdout }}"
    dest: /etc/wireguard/private.key
    mode: "0600"
    owner: root
    group: root
  tags: wireguard

# ─── Создаём конфиг WireGuard ────────────

- name: Create WireGuard config
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
    owner: root
    group: root
  notify: Restart WireGuard
  tags: wireguard

# ─── Открываем порт для WireGuard ────────

- name: UFW - allow WireGuard
  ufw:
    rule: allow
    port: "51820"
    proto: udp
  tags: firewall

# ─── Запускаем WireGuard ─────────────────

- name: Enable and start WireGuard
  service:
    name: wg-quick@wg0
    state: started
    enabled: true
  tags: wireguard

# Показываем статус WireGuard
- name: Show WireGuard status
  command: wg show
  register: wg_status
  changed_when: false
  tags: wireguard

- name: Print WireGuard status
  debug:
    msg: "{{ wg_status.stdout }}"
  tags: wireguard