---
- name: Install WireGuard
  apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
    update_cache: true
  tags: wireguard

- name: Check if private key already exists
  stat:
    path: /etc/wireguard/private.key
  register: wg_private_key_file
  tags: wireguard

- name: Generate WireGuard private key
  shell: wg genkey
  register: wg_private_key_generated
  when: not wg_private_key_file.stat.exists
  tags: wireguard

- name: Save private key to file
  copy:
    content: "{{ wg_private_key_generated.stdout }}"
    dest: /etc/wireguard/private.key
    mode: "0600"
    owner: root
    group: root
  when: not wg_private_key_file.stat.exists
  tags: wireguard

- name: Read private key from file
  slurp:
    src: /etc/wireguard/private.key
  register: wg_private_key_slurped
  tags: wireguard

- name: Generate WireGuard public key from private key
  shell: echo "{{ wg_private_key_slurped.content | b64decode | trim }}" | wg pubkey
  register: wg_public_key_generated
  changed_when: false
  tags: wireguard

- name: Save public key to file
  copy:
    content: "{{ wg_public_key_generated.stdout }}"
    dest: /etc/wireguard/public.key
    mode: "0644"
    owner: root
    group: root
  tags: wireguard

- name: Set key facts for template usage
  set_fact:
    wg_private_key: "{{ wg_private_key_slurped.content | b64decode | trim }}"
    wg_public_key: "{{ wg_public_key_generated.stdout | trim }}"
  tags: wireguard

- name: Create WireGuard config
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
    owner: root
    group: root
  notify: Restart WireGuard
  tags: wireguard

- name: UFW - allow WireGuard
  ufw:
    rule: allow
    port: "51820"
    proto: udp
  tags: firewall

- name: Enable and start WireGuard
  service:
    name: wg-quick@wg0
    state: started
    enabled: true
  tags: wireguard

- name: Show WireGuard status
  command: wg show
  register: wg_status
  changed_when: false
  tags: wireguard

- name: Print WireGuard status
  debug:
    msg: "{{ wg_status.stdout }}"
  tags: wireguard
