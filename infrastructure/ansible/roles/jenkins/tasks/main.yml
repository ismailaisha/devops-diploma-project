---
- name: Check supported operating system
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_architecture == "x86_64"
    fail_msg: "This role expects Ubuntu x86_64."

- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker repository key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Remove legacy Docker repository entry
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Configure Docker repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Install Docker Engine and build tools
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Read Docker socket group
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: jenkins_docker_socket

- name: Check Docker socket exists
  ansible.builtin.assert:
    that:
      - jenkins_docker_socket.stat.exists
      - jenkins_docker_socket.stat.issock
    fail_msg: "Docker socket is unavailable."

- name: Create persistent Jenkins home
  ansible.builtin.file:
    path: /opt/jenkins
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0750"

- name: Create Jenkins deployment directory
  ansible.builtin.file:
    path: /opt/jenkins-stack
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy Jenkins Dockerfile
  ansible.builtin.copy:
    src: Dockerfile
    dest: /opt/jenkins-stack/Dockerfile
    owner: root
    group: root
    mode: "0644"

- name: Configure Jenkins Compose stack
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/jenkins-stack/compose.yml
    owner: root
    group: root
    mode: "0644"

- name: Allow Jenkins HTTP port in host firewall
  community.general.ufw:
    rule: allow
    port: "8080"
    proto: tcp

- name: Validate Jenkins Compose configuration
  ansible.builtin.command:
    cmd: docker compose -f compose.yml config --quiet
    chdir: /opt/jenkins-stack
  changed_when: false

- name: Build Jenkins image
  ansible.builtin.command:
    cmd: docker compose -f compose.yml build jenkins
    chdir: /opt/jenkins-stack
  changed_when: true

- name: Start Jenkins container
  ansible.builtin.command:
    cmd: docker compose -f compose.yml up -d --no-build
    chdir: /opt/jenkins-stack
  changed_when: true

- name: Wait for Jenkins login page
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/login
    status_code: 200
  register: jenkins_http_status
  until: jenkins_http_status.status | default(0) == 200
  retries: 60
  delay: 5

- name: Verify Docker access from Jenkins user
  ansible.builtin.command:
    cmd: docker exec --user jenkins jenkins docker version
  changed_when: false

- name: Verify Docker Buildx inside Jenkins
  ansible.builtin.command:
    cmd: docker exec --user jenkins jenkins docker buildx version
  changed_when: false

- name: Verify SSH client inside Jenkins
  ansible.builtin.command:
    cmd: docker exec --user jenkins jenkins ssh -V
  changed_when: false