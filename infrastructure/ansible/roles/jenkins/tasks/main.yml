---
# ─────────────────────────────────────────
# Роль jenkins — настройка Jenkins Server
# Jenkins запускается в Docker контейнере
# ─────────────────────────────────────────

# ─── Установка Java ─────────────────────
- name: Install Java
  apt:
    name: openjdk-17-jdk
    state: present
    update_cache: true
  tags: java

- name: Check Java version
  command: java -version
  register: java_version
  changed_when: false
  tags: java

# ─── Установка Docker ───────────────────

- name: Create keyrings directory
  file:
    path: /usr/share/keyrings
    state: directory
    mode: "0755"
  tags: docker

- name: Add Docker GPG key
  shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
    gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/docker-archive-keyring.gpg
  tags: docker

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
    state: present
    filename: docker
  tags: docker

- name: Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true
  tags: docker

- name: Start and enable Docker
  service:
    name: docker
    state: started
    enabled: true
  tags: docker

# ─── Запуск Jenkins через Docker ────────

- name: Create Jenkins directory
  file:
    path: /opt/jenkins
    state: directory
    owner: 1000
    group: 1000
    mode: "0755"
  tags: jenkins

- name: Run Jenkins container
  shell: |
    docker run -d \
      --name jenkins \
      --restart unless-stopped \
      -p 8080:8080 \
      -p 50000:50000 \
      -v /opt/jenkins:/var/jenkins_home \
      -v /var/run/docker.sock:/var/run/docker.sock \
      jenkins/jenkins:lts
  args:
    creates: /opt/jenkins/config.xml
  tags: jenkins

# ─── Открываем порты ────────────────────

- name: UFW - allow Jenkins UI
  ufw:
    rule: allow
    port: "8080"
    proto: tcp
  tags: firewall

- name: UFW - allow Jenkins agent
  ufw:
    rule: allow
    port: "50000"
    proto: tcp
  tags: firewall

# ─── Начальный пароль Jenkins ────────────

- name: Wait for Jenkins to start
  wait_for:
    timeout: 60
  tags: jenkins

- name: Get Jenkins initial password
  shell: docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
  register: jenkins_password
  ignore_errors: true
  changed_when: false
  tags: jenkins

- name: Show Jenkins initial password
  debug:
    msg: "Jenkins initial password: {{ jenkins_password.stdout }}"
  when: jenkins_password.stdout is defined
  tags: jenkins