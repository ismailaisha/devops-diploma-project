---
# PostgreSQL 15 + Patroni с etcd3.
# Конфигурация самого кластера etcd управляется отдельно.

- name: Check existing Patroni configuration
  ansible.builtin.stat:
    path: /etc/patroni/patroni.yml
  register: database_config_file

- name: Read existing Patroni configuration
  ansible.builtin.slurp:
    src: /etc/patroni/patroni.yml
  register: database_config_content
  when: database_config_file.stat.exists
  no_log: true

- name: Parse existing Patroni configuration
  ansible.builtin.set_fact:
    database_existing_config: >-
      {{
        (database_config_content.content | b64decode | from_yaml)
        if database_config_file.stat.exists
        else {}
      }}
  no_log: true

# Существующие пароли сохраняются.
# Для нового сервера их необходимо передать через Ansible Vault.
- name: Resolve PostgreSQL credentials
  ansible.builtin.set_fact:
    database_authentication: >-
      {{
        database_existing_config.get('postgresql', {}).get(
          'authentication',
          {
            'superuser': {
              'username': 'postgres',
              'password': database_superuser_password | default('')
            },
            'replication': {
              'username': 'replicator',
              'password': database_replication_password | default('')
            }
          }
        )
      }}
  no_log: true

- name: Require PostgreSQL credentials
  ansible.builtin.assert:
    that:
      - database_authentication.superuser.password | length > 0
      - database_authentication.replication.password | length > 0
    fail_msg: >-
      PostgreSQL credentials are missing. For a new server, supply
      database_superuser_password and database_replication_password
      through Ansible Vault.
  no_log: true

- name: Install repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
      - python3-pip
      - python3-psycopg2
    state: present

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install PostgreSQL repository key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/postgresql-archive-keyring.asc
    owner: root
    group: root
    mode: "0644"

- name: Remove legacy PostgreSQL repository file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/apt_postgresql_org_pub_repos_apt.list
    state: absent

- name: Configure PostgreSQL repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/postgresql-archive-keyring.asc]
      https://apt.postgresql.org/pub/repos/apt
      {{ ansible_distribution_release }}-pgdg main
    filename: fitflow-postgresql
    state: present
    update_cache: false

- name: Remove obsolete pgdg repository file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pgdg.list
    state: absent

- name: Install PostgreSQL and etcd packages
  ansible.builtin.apt:
    name:
      - postgresql-15
      - postgresql-client-15
      - etcd-server
      - etcd-client
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101

# Не останавливаем работающий PostgreSQL:
# его процессом уже управляет Patroni.
- name: Disable standalone PostgreSQL service at boot
  ansible.builtin.systemd:
    name: postgresql
    enabled: false

- name: Ensure existing etcd service is running
  ansible.builtin.systemd:
    name: etcd
    state: started
    enabled: true

- name: Install Patroni with etcd3 support
  ansible.builtin.pip:
    name:
      - "patroni[etcd3]==4.1.4"
      - psycopg2-binary
    state: present
    extra_args: "--break-system-packages"
  notify: Restart Patroni

- name: Create Patroni configuration directory
  ansible.builtin.file:
    path: /etc/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Ensure PostgreSQL data directory exists
  ansible.builtin.file:
    path: /data/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Ensure PostgreSQL socket directory exists
  ansible.builtin.file:
    path: /var/run/postgresql
    state: directory
    owner: postgres
    group: postgres
    mode: "2775"

- name: Configure Patroni
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: /etc/patroni/patroni.yml
    owner: postgres
    group: postgres
    mode: "0600"
  no_log: true
  notify: Restart Patroni

- name: Configure Patroni systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/patroni.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Patroni PostgreSQL HA
      Wants=network-online.target etcd.service
      After=network-online.target etcd.service

      [Service]
      User=postgres
      Group=postgres
      ExecStart=/usr/local/bin/patroni /etc/patroni/patroni.yml
      Restart=on-failure
      RestartSec=5
      TimeoutStopSec=120
      KillMode=process

      [Install]
      WantedBy=multi-user.target
  notify:
    - Reload systemd
    - Restart Patroni

- name: Remove obsolete AWS backup cron job
  ansible.builtin.cron:
    name: "FitFlow database backup"
    user: postgres
    state: absent

- name: Remove obsolete S3 backup script
  ansible.builtin.file:
    path: /usr/local/bin/fitflow-backup.sh
    state: absent

- name: Apply pending service changes
  ansible.builtin.meta: flush_handlers

- name: Ensure Patroni is enabled and running
  ansible.builtin.systemd:
    name: patroni
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for PostgreSQL health through Patroni
  ansible.builtin.uri:
    url: http://127.0.0.1:8008/health
    status_code: 200
  register: database_health
  until: database_health.status | default(0) == 200
  retries: 60
  delay: 2