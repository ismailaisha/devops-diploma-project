---
# ─────────────────────────────────────────
# Роль database — настройка PostgreSQL
# с репликацией через Patroni
# Выполняется на pg_master и pg_replica
# ─────────────────────────────────────────

# ─── Установка зависимостей ─────────────
- name: Install dependencies
  apt:
    name:
      - python3-pip
      - python3-dev
      - libpq-dev
      - wget
      - curl
    state: present
    update_cache: true
  tags: packages

# ─── Установка PostgreSQL 15 ─────────────
# Best Practice: Удаляем старый файл репозитория, чтобы не было конфликта Signed-By
- name: Remove old conflicting PostgreSQL repository file
  file:
    path: /etc/apt/sources.list.d/apt_postgresql_org_pub_repos_apt.list
    state: absent
  tags: postgres

# Скачиваем GPG-ключ по современным стандартам Ubuntu 24.04
- name: Add PostgreSQL GPG key
  get_url:
    url: https://postgresql.org
    dest: /usr/share/keyrings/postgresql-archive-keyring.asc
    mode: "0644"
  tags: postgres

# Добавляем репозиторий с привязкой к новому keyring
- name: Add PostgreSQL repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.asc] http://apt.postgresql.org/pub/repos/apt {{ ansible_lsb.codename }}-pgdg main"
    state: present
  tags: postgres

- name: Install PostgreSQL 15
  apt:
    name:
      - postgresql-15
      - postgresql-client-15
      - postgresql-contrib-15
    state: present
    update_cache: true
  tags: postgres

# Останавливаем PostgreSQL — Patroni будет управлять им
- name: Stop PostgreSQL service
  service:
    name: postgresql
    state: stopped
    enabled: false
  tags: postgres

# ─── Установка etcd ──────────────────────
- name: Install etcd and client
  apt:
    name:
      - etcd-server
      - etcd-client
    state: present
  tags:
    - etcd
    - client

- name: Start and enable etcd
  service:
    name: etcd
    state: started
    enabled: true
  tags:
    - etcd

# ─── Установка Patroni ───────────────────
- name: Install Patroni
  pip:
    name:
      - patroni[etcd]
      - psycopg2-binary
    state: present
    extra_args: "--break-system-packages" # Совместимо со всеми версиями Ansible на Ubuntu 24.04
  tags: patroni

# Создаём папку для конфига Patroni
- name: Create Patroni config directory
  file:
    path: /etc/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"
  tags: patroni

# Создаём папку для данных PostgreSQL
- name: Create PostgreSQL data directory
  file:
    path: /data/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  tags: patroni

# Копируем конфиг Patroni на server
- name: Copy Patroni config
  template:
    src: patroni.yml.j2
    dest: /etc/patroni/patroni.yml
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart Patroni
  tags: patroni

# Создаём systemd сервис для Patroni
- name: Create Patroni systemd service
  copy:
    content: |
      [Unit]
      Description=Patroni PostgreSQL HA
      After=network.target

      [Service]
      User=postgres
      Group=postgres
      ExecStart=/usr/local/bin/patroni /etc/patroni/patroni.yml
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/patroni.service
    mode: "0644"
  notify: Reload systemd
  tags: patroni

# Запускаем Patroni
- name: Start and enable Patroni
  service:
    name: patroni
    state: started
    enabled: true
  tags: patroni

# ─── Настройка бэкапов ───────────────────
- name: Install AWS CLI for backups
  pip:
    name: awscli
    state: present
    extra_args: "--break-system-packages" # Совместимо со всеми версиями Ansible на Ubuntu 24.04
  tags: backup

# Создаём скрипт бэкапа
- name: Create backup script
  copy:
    content: |
      #!/bin/bash
      DATE=$(date +%Y%m%d_%H%M%S)
      BACKUP_FILE="/tmp/fitflow_backup_${DATE}.sql.gz"

      # Создаём бэкап
      pg_dump -U postgres fitflow | gzip > $BACKUP_FILE

      # Загружаем в S3
      aws s3 cp $BACKUP_FILE s3://fitflow-backups-080403789929/backups/

      # Удаляем локальный файл
      rm -f $BACKUP_FILE
      echo "Backup completed: $DATE"
    dest: /usr/local/bin/fitflow-backup.sh
    mode: "0755"
  tags: backup

# Добавляем в cron — каждую ночь в 2:00
- name: Add backup cron job
  cron:
    name: "FitFlow database backup"
    minute: "0"
    hour: "2"
    job: "/usr/local/bin/fitflow-backup.sh >> /var/log/fitflow-backup.log 2>&1"
    user: postgres
  tags: backup
