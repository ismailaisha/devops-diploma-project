---
# ============================================================
# Подготовка App Server: Docker, firewall, каталог приложения
# ============================================================

- name: Check supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: "This role currently supports Ubuntu x86_64."

# ============================================================
# DOCKER
# ============================================================

- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Docker APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Start and enable Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Add connection user to Docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

# ============================================================
# FIREWALL
# ============================================================

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

# API and Redis will be accessed inside the Docker network.
# UFW activation is handled separately from this role.

# ============================================================
# APPLICATION DIRECTORY
# ============================================================

- name: Create application directory
  ansible.builtin.file:
    path: /opt/fitflow
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

# ============================================================
# CHECKS
# ============================================================

- name: Verify Docker Engine
  ansible.builtin.command:
    cmd: docker info
  changed_when: false

- name: Verify Docker Compose
  ansible.builtin.command:
    cmd: docker compose version
  changed_when: false

- name: Deploy FitFlow application
  ansible.builtin.import_tasks: deploy.yml
  tags:
    - app_deploy