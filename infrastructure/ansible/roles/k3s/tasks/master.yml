---
- name: "Master: Установка K3s и привязка к интерфейсу wg0"
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io  | sh -s - server \
      --node-ip=10.8.0.5 \
      --flannel-iface=wg0 \
      --write-kubeconfig-mode "644"
  tags: k3s


- name: "Master: Ожидание появления токена кластера"
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 30

- name: "Master: Чтение сгенерированного токена"
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_encoded

- name: "Master: Динамическое сохранение токена в памяти Ansible без хардкода"
  ansible.builtin.set_fact:
    k3s_cluster_token: "{{ k3s_token_encoded['content'] | b64decode | trim }}"
  delegate_to: localhost
  delegate_facts: true
