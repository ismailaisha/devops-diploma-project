services:
  postgres:
    image: postgres:15-alpine
    container_name: fitflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitflow
      POSTGRES_USER: fitflow
      POSTGRES_PASSWORD: fitflow_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - fitflow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fitflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - fitflow_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: aisharust94/fitflow-api:cea2e3b
    container_name: fitflow_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fitflow:fitflow_password@postgres:5432/fitflow
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fitflow_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    image: aisharust94/fitflow-worker:50c6f65
    container_name: fitflow_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fitflow:fitflow_password@postgres:5432/fitflow
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fitflow_network

  frontend:
    image: aisharust94/fitflow-frontend:v1.0
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fitflow_network

volumes:
  pg_data:

networks:
  fitflow_network:
    driver: bridge