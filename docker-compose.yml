name: fitflow

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - fitflow_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: aisharust94/fitflow-api:${API_TAG:-dev}
    build:
      context: ./services/api
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fitflow_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: aisharust94/fitflow-worker:${WORKER_TAG:-dev}
    build:
      context: ./services/worker
    restart: unless-stopped
    command:
      - celery
      - -A
      - tasks.notifications.celery_app
      - worker
      - --loglevel=info
      - --concurrency=2
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fitflow_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: aisharust94/fitflow-frontend:${FRONTEND_TAG:-dev}
    build:
      context: ./services/frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - fitflow_network
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:

networks:
  fitflow_network:
    driver: bridge