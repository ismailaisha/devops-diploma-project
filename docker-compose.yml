services:
  postgres:
    image: postgres:15-alpine
    container_name: fitflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitflow
      POSTGRES_USER: fitflow
      POSTGRES_PASSWORD: fitflow_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - fitflow_network

  redis:
    image: redis:7-alpine
    container_name: fitflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - fitflow_network

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: fitflow_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fitflow:fitflow_password@postgres:5432/fitflow
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - fitflow_network

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: fitflow_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - fitflow_network

volumes:
  pg_data:

networks:
  fitflow_network:
    driver: bridge